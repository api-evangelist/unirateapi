note: >-
  Limits are enforced per API key and reset at midnight UTC. On exhaustion the API returns
  HTTP 429 with a JSON body ({"error":"Rate limit exceeded"}). The published docs describe
  the reset timing in prose ("429 error with information about when your limit resets
  (midnight UTC)") but do NOT document machine-readable RateLimit-*/X-RateLimit-*/Retry-After
  response headers, so an agent must fall back to the documented daily quota rather than a
  runtime header signal.
