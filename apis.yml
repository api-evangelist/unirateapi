aid: unirateapi
name: UniRate API
description: The UniRate API provides current foreign-exchange rates, currency conversion, a list of supported
  currencies, and country VAT rates over a simple REST interface. Current-rate endpoints are available
  on a free, self-serve tier (get a key at https://unirateapi.com); historical, precious-metals and
  commodities endpoints require a Pro subscription. Open-source client libraries are published for Python,
  Node/TypeScript, Go, Rust, Ruby, PHP, Java, Swift, .NET and more, plus an official MCP server for AI agents.
